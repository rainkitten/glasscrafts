name: Auto Release on Tag

on:
  push:
    tags:
      - 'v*' # 只要推送以 'v' 开头的标签（例如 v1.0.1），就会触发此工作流

permissions:
  contents: write # 赋予 Actions 写入和创建 Release 的权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 缓存 Gradle 依赖以加快后续构建速度
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. 授予 gradlew 权限并进行构建
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # 5. 自动创建 GitHub Release 并上传生成的 jar 包附件
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar # 自动扫描并上传 build/libs 下的所有 jar 文件
          draft: false
          prerelease: false
          generate_release_notes: true # 自动根据提交记录生成 Release 说明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
